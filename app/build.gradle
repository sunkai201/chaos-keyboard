plugins {
    id 'com.android.application'
}

android {
    namespace 'com.keyquota.ime'
    compileSdk 35

    defaultConfig {
        applicationId "com.keyquota.ime"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'mp4'
    }
}

dependencies {
}
